<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Molt — a stack of tabs, the top one shedding away -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98a4f"/>
      <stop offset="1" stop-color="#b25c29"/>
    </linearGradient>
    <path id="tab" d="M0,30 V8 Q0,0 8,0 H52 Q60,0 60,8 V30 Z"/>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- bottom layer -->
  <use href="#tab" transform="translate(30,72)" fill="#ffffff" opacity="0.32"/>

  <!-- middle layer -->
  <use href="#tab" transform="translate(36,54)" fill="#ffffff" opacity="0.58"/>

  <!-- top layer, lifting off -->
  <use href="#tab" transform="translate(46,36) rotate(-10 30 15)" fill="#ffffff"/>
</svg>
